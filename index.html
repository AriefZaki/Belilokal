<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BeliLokal - Shopee & Lazada Clone & Darrez_Shop Seller Centre</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome CDN -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            shopee: '#ee4d2d',
            shopeeDark: '#d73211',
            shopeeLight: '#fef2ee',
            lazadaBlue: '#0f146d',
            lazadaTeal: '#00ced1',
          }
        }
      }
    }
  </script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap');
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: #f5f5f5;
    }
    .scrollbar-hide::-webkit-scrollbar {
      display: none;
    }
    .scrollbar-hide {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>
</head>
<body class="text-slate-800 antialiased min-h-screen flex flex-col">

  <!-- ================= TOP NOTIFICATION / BAR ================= -->
  <div class="bg-gradient-to-r from-orange-600 via-shopee to-red-600 text-white text-xs py-1.5 px-4 shadow-sm">
    <div class="max-w-7xl mx-auto flex flex-wrap justify-between items-center gap-2">
      <div class="flex items-center space-x-4">
        <span class="font-medium flex items-center gap-1.5"><i class="fa-solid fa-store"></i> Seller Centre Rasmi Darrez_Shop</span>
        <span class="hidden md:inline text-orange-200">|</span>
        <span class="hidden md:flex items-center gap-1"><i class="fa-solid fa-truck-fast"></i> Penghantaran Pantas Seluruh Malaysia (J&T, Pos Laju, SPX)</span>
      </div>
      <div class="flex items-center space-x-4 font-medium" id="topNavSellerActions">
        <button onclick="openSellerAuthModal()" class="hover:text-orange-200 transition flex items-center gap-1 bg-white/20 hover:bg-white/30 px-2.5 py-0.5 rounded text-[11px]">
          <i class="fa-solid fa-lock"></i> Log Masuk Penjual (Darrez_Shop)
        </button>
        <span class="text-orange-200">|</span>
        <button onclick="switchTab('tracking')" class="hover:underline flex items-center gap-1">
          <i class="fa-solid fa-route"></i> Semak Pesanan
        </button>
      </div>
    </div>
  </div>

  <!-- ================= MAIN HEADER ================= -->
  <header class="bg-shopee text-white sticky top-0 z-40 shadow-md">
    <div class="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between gap-4">
      <!-- Logo -->
      <a href="javascript:void(0)" onclick="switchTab('marketplace')" class="flex items-center gap-2 group">
        <div class="w-10 h-10 bg-white rounded-xl flex items-center justify-center text-shopee shadow-sm group-hover:scale-105 transition transform">
          <i class="fa-solid fa-bag-shopping text-2xl"></i>
        </div>
        <div>
          <h1 class="text-2xl font-black tracking-tight leading-none text-white drop-shadow">BeliLokal</h1>
          <span class="text-[10px] tracking-wider font-semibold text-orange-100 uppercase">Pasaran & Mall No. 1</span>
        </div>
      </a>

      <!-- Search Bar -->
      <div class="flex-1 max-w-2xl relative">
        <div class="flex bg-white rounded-lg p-1 shadow-inner text-slate-800 focus-within:ring-2 focus-within:ring-orange-300 transition">
          <input 
            type="text" 
            id="searchInput" 
            placeholder="Cari produk seperti Kopi Arabica, Pelindung Skrin, Baju Kurung..." 
            class="w-full px-3 py-1.5 text-sm outline-none rounded-l-md"
            onkeyup="handleSearch(event)"
          >
          <button onclick="executeSearch()" class="bg-shopee hover:bg-shopeeDark text-white px-5 py-1.5 rounded-md text-sm font-semibold transition flex items-center gap-2">
            <i class="fa-solid fa-magnifying-glass"></i>
            <span class="hidden sm:inline">Cari</span>
          </button>
        </div>
        <!-- Quick search tags -->
        <div class="flex gap-3 text-[11px] text-orange-100 mt-1 overflow-x-auto scrollbar-hide whitespace-nowrap">
          <span class="cursor-pointer hover:underline" onclick="filterBySearch('Kopi')">Kopi Arabica</span>
          <span class="cursor-pointer hover:underline" onclick="filterBySearch('Pelindung')">Screen Protector</span>
          <span class="cursor-pointer hover:underline" onclick="filterBySearch('Baju')">Baju Kurung</span>
          <span class="cursor-pointer hover:underline" onclick="filterBySearch('Beg')">Beg Kalis Air</span>
          <span class="cursor-pointer hover:underline" onclick="filterBySearch('Bluetooth')">Earbuds</span>
        </div>
      </div>

      <!-- User Cart & Shop Action -->
      <div class="flex items-center gap-3">
        <button onclick="switchTab('marketplace')" class="text-white hover:text-orange-200 text-sm font-semibold hidden md:flex items-center gap-1.5 px-3 py-1.5 rounded-lg bg-orange-700/40">
          <i class="fa-solid fa-compass"></i> Mall
        </button>

        <!-- Cart Button -->
        <button onclick="openCartModal()" class="relative p-2.5 bg-white/10 hover:bg-white/20 rounded-xl transition flex items-center justify-center text-white">
          <i class="fa-solid fa-cart-shopping text-xl"></i>
          <span id="cartCountBadge" class="absolute -top-1 -right-1 bg-yellow-300 text-slate-900 font-extrabold text-[11px] w-5 h-5 rounded-full flex items-center justify-center shadow-md">0</span>
        </button>
      </div>
    </div>
  </header>

  <!-- ================= NOTIFICATION BANNER / SELLER PROMO ================= -->
  <div id="darrezHighlightBar" class="bg-amber-50 border-b border-amber-200 py-2.5 px-4 text-amber-900 text-xs sm:text-sm">
    <div class="max-w-7xl mx-auto flex flex-wrap justify-between items-center gap-2">
      <div class="flex items-center gap-2">
        <span class="bg-amber-600 text-white text-[10px] font-bold px-2 py-0.5 rounded uppercase tracking-wide">Pilihan Utama</span>
        <span class="font-medium">Lawati kedai rasmi pilihan: <strong>Darrez_Shop</strong> (Penjual Sah & Preferred+)</span>
      </div>
      <div class="
